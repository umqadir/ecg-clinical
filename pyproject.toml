[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecg-clinical"
version = "0.1.0"
description = "Cross-hospital generalization and calibration for multi-label ECG classification"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "einops==0.8.1",
  "matplotlib==3.10.7",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==22.0.0",
  "PyYAML==6.0.3",
  "requests==2.32.5",
  "scikit-learn==1.8.0",
  "scipy==1.16.3",
  "seaborn==0.13.2",
  "torch==2.12.1",
  "tqdm==4.67.1",
  "wfdb==4.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_clinical"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
